name: 'Physics Lint'
description: 'Fail the build when an S-parameter model or coupling extractor predicts physics that cannot exist.'
author: 'ChipletOS / Genesis contributors'
branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  files:
    description: 'Glob of Touchstone files to check (e.g. "models/**/*.s*p"). Empty disables the S-parameter check.'
    required: false
    default: ''
  extractor:
    description: 'Dotted path module:function of a coupling extractor to check against the screening ceiling. Empty disables.'
    required: false
    default: ''
  self-test:
    description: 'Run the checkers own negative control first. A clean report from an unverified checker is worth nothing.'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail the build on violations. Set false to report only.'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to use.'
    required: false
    default: '3.11'
  sarif-file:
    description: >-
      Write SARIF 2.1.0 here as well as the JSON report. Upload it with
      github/codeql-action/upload-sarif to get findings in the Security tab.
      Empty disables. Note results carry no line region: a physics failure
      happens at a frequency, not a line, and a fabricated region would
      misreport where the problem is.
    required: false
    default: ''

outputs:
  violations:
    description: 'Total number of violations found.'
    value: ${{ steps.run.outputs.violations }}
  report:
    description: 'Path to the JSON report.'
    value: ${{ steps.run.outputs.report }}
  sarif:
    description: 'Path to the SARIF file, if sarif-file was set.'
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install checkers
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        # Installed from source: these are not on a package index yet.
        # Swap for `sparam-lint maxwell-lint` once they are published.
        python -m pip install --quiet git+https://github.com/nickharris808/sparam-lint.git@main git+https://github.com/nickharris808/maxwell-lint.git@main
        # physics-lint owns the SARIF conversion, so there is one copy of it
        # rather than one per checker.
        if [ -n "${{ inputs.sarif-file }}" ]; then
          python -m pip install --quiet git+https://github.com/nickharris808/physics-lint.git@main
        fi

    - name: Verify the checkers discriminate
      if: inputs.self-test == 'true'
      shell: bash
      run: |
        echo "::group::negative control"
        sparam-lint --self-test --no-colour
        echo "::endgroup::"

    - name: Run physics lint
      id: run
      shell: bash
      run: python "${{ github.action_path }}/run_lint.py"
      env:
        PL_FILES: ${{ inputs.files }}
        PL_EXTRACTOR: ${{ inputs.extractor }}
        PL_FAIL: ${{ inputs.fail-on-error }}
        PL_SARIF: ${{ inputs.sarif-file }}
